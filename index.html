<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0f172a; color: #e2e8f0;
    height: 100vh; overflow: hidden;
  }
  .layout { display: flex; height: 100vh; }

  /* ===== 左侧导航 ===== */
  .sidebar {
    width: 272px; flex-shrink: 0;
    background: #0b1220;
    border-right: 1px solid #1e293b;
    display: flex; flex-direction: column;
  }
  .sidebar-header { padding: 20px 18px 12px; border-bottom: 1px solid #1e293b; }
  .sidebar-header h1 { font-size: 16px; font-weight: 700; color: #f1f5f9; }
  .sidebar-header p { font-size: 11px; color: #8b93a7; margin-top: 3px; }
  .nav { flex: 1; overflow-y: auto; padding: 8px 10px 24px; }
  .nav::-webkit-scrollbar { width: 6px; }
  .nav::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  .nav-group-title {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1.2px; color: #8b93a7;
    padding: 16px 10px 6px;
  }
  .nav-item {
    display: block; width: 100%; text-align: left;
    background: none; border: none; cursor: pointer;
    padding: 9px 12px; border-radius: 8px;
    color: #cbd5e1; font-size: 13px; line-height: 1.45;
    font-family: inherit;
    transition: background .15s, color .15s;
  }
  .nav-item:hover { background: #243049; color: #f1f5f9; }
  .nav-item.active { background: rgba(99,102,241,.18); color: #c7d2fe; }
  .nav-item .t { display: block; font-weight: 500; }
  .nav-item .d { display: block; font-size: 11px; color: #94a3b8; margin-top: 2px; }
  .nav-item.active .d { color: #a5b4fc; }
  .nav-item .badge {
    display: inline-block; font-size: 10px; font-weight: 500;
    padding: 1px 5px; border-radius: 3px; margin-left: 5px;
    background: rgba(245,158,11,.18); color: #fbbf24; vertical-align: middle;
  }
  .submenu {
    padding: 0 10px 8px 10px;
    display: none;
  }
  .submenu.open { display: block; }
  .submenu .sub-item {
    display: block; width: 100%; text-align: left;
    background: none; border: none; cursor: pointer;
    padding: 7px 12px 7px 28px; border-radius: 6px;
    color: #a8b3c8; font-size: 12px; line-height: 1.4;
    font-family: inherit;
    transition: background .15s, color .15s;
  }
  .submenu .sub-item:hover { background: #243049; color: #f1f5f9; }
  .submenu .sub-item.active { color: #c7d2fe; background: rgba(99,102,241,.12); }
  .sidebar-footer {
    padding: 12px 18px; border-top: 1px solid #1e293b;
    font-size: 11px; color: #7c86a0; line-height: 1.6;
  }

  /* ===== 右侧内容区 ===== */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  /* ---- 首页：文档目录 ---- */
  .home {
    flex: 1; overflow-y: auto; padding: 48px 32px 64px;
    display: flex; justify-content: center;
  }
  .home-inner { max-width: 860px; width: 100%; }
  .home h2 { font-size: 26px; font-weight: 700; color: #f1f5f9; letter-spacing: .5px; }
  .home-sub { font-size: 14px; color: #8b93a7; margin-top: 8px; line-height: 1.6; }
  .stats { display: flex; gap: 12px; margin: 32px 0 8px; }
  .stat {
    flex: 1; background: #1e293b; border: 1px solid #334155;
    border-radius: 10px; padding: 14px 16px;
  }
  .stat-num { font-size: 22px; font-weight: 700; color: #a5b4fc; }
  .stat-label { font-size: 12px; color: #94a3b8; margin-top: 4px; }

  .toc { margin-top: 24px; }
  .toc-group { margin-bottom: 28px; }
  .toc-group-title {
    font-size: 15px; font-weight: 600; color: #f1f5f9;
    padding-bottom: 10px; margin-bottom: 4px;
    border-bottom: 1px solid #1e293b;
    display: flex; align-items: center; gap: 8px;

    padding: 1px 5px; border-radius: 3px;
    background: rgba(245,158,11,.18); color: #fbbf24;
  }
  .toc-row {
    display: grid; grid-template-columns: 52px 190px 1fr 28px;
    align-items: center; gap: 8px;
    width: 100%; text-align: left;
    background: none; border: none; cursor: pointer;
    padding: 11px 10px; border-radius: 8px;
    color: inherit; font-family: inherit;
    transition: background .15s;
  }
  .toc-row:hover { background: #1e293b; }
  .toc-no { font-size: 12px; color: #6366f1; font-weight: 600; font-variant-numeric: tabular-nums; }
  .toc-title { font-size: 14px; font-weight: 500; color: #e2e8f0; }
  .toc-desc { font-size: 12px; color: #94a3b8; line-height: 1.5; }
  .toc-arrow { font-size: 14px; color: #475569; text-align: right; transition: color .15s, transform .15s; }
  .toc-row:hover .toc-arrow { color: #818cf8; transform: translateX(3px); }

  .home-foot {
    margin-top: 40px; padding-top: 16px; border-top: 1px solid #1e293b;
    font-size: 11px; color: #7c86a0; line-height: 1.7;
  }

  #frame { flex: 1; width: 100%; border: none; background: #0f172a; display: none; }
</style>

<script>
  var REPORTS = {
    page1:  { file: '金融体系蓝图.html',                    title: '个人金融体系蓝图' },
    page2:  { file: '学习路线.html',                        title: '完整学习路线' },
    page3:  { file: '核心学习讲义.html',                    title: '核心学习讲义' },
    page4:  { file: '金融视频课程-连贯版.html',             title: '从小白到能自己管钱' },
    page5:  { file: '美日汇率干预与全球金融传导学习笔记.html', title: '美日汇率干预与全球金融传导' },
    page6:  { file: 'Intel增发案例分析.html',               title: 'Intel $200亿增发案例分析' },
    page7:  { file: 'AI硬件长期建仓策略.html',              title: 'AI硬件长期建仓策略' },
    page8:  { file: 'AI产业链深度研究讲义.html',            title: 'AI产业链深度研究讲义' },
    page9:  { file: 'ASIC四标的深度建仓分析.html',          title: 'ASIC四标的深度建仓分析' },
    page10: { file: 'AI资本结构风险与泡沫类比分析.html',    title: 'AI资本结构风险与泡沫类比分析' }
  };
  var GROUP_PAGES = { page1: 1, page2: 1, page3: 1, page4: 1 };

  var frame = document.getElementById('frame');
  var home = document.getElementById('home');
  var items = Array.prototype.slice.call(document.querySelectorAll('.nav-item'));
  var subItems = Array.prototype.slice.call(document.querySelectorAll('.sub-item'));
  var tocRows = Array.prototype.slice.call(document.querySelectorAll('.toc-row'));

  function showHome() {
    home.style.display = 'flex';
    frame.style.display = 'none';
    items.forEach(function (it) { it.classList.remove('active'); });
    subItems.forEach(function (s) { s.classList.remove('active'); });
    document.title = '投资研究知识库';
  }

  function openPage(page) {
    var r = REPORTS[page];
    if (!r) return;
    home.style.display = 'none';
    frame.style.display = 'block';
    frame.src = r.file;
    items.forEach(function (it) {
      it.classList.toggle('active', it.getAttribute('data-page') === page);
    });
    subItems.forEach(function (s) {
      s.classList.toggle('active', s.getAttribute('data-page') === page);
    });
    document.title = r.title + ' · 投资研究知识库';
  }

  function route() {
    var h = (location.hash || '').replace('#', '');
    if (h === '' || h === 'home' || !REPORTS[h]) { showHome(); return; }
    if (GROUP_PAGES[h]) {
      document.getElementById('submenu-foundation').classList.add('open');
    }
    openPage(h);
    var target = document.querySelector('[data-page="' + h + '"]');
    if (target && target.scrollIntoView) target.scrollIntoView({ block: 'nearest' });
  }

  function go(page) {
    if (location.hash === '#' + page) { route(); } else { location.hash = page; }
  }

  items.forEach(function (item) {
    item.addEventListener('click', function () {
      var toggle = item.getAttribute('data-toggle');
      if (toggle) {
        document.getElementById(toggle).classList.toggle('open');
      } else {
        var page = item.getAttribute('data-page');
        if (page) go(page);
      }
    });
  });

  subItems.forEach(function (sub) {
    sub.addEventListener('click', function () {
      go(sub.getAttribute('data-page'));
    });
  });

  tocRows.forEach(function (row) {
    row.addEventListener('click', function () {
      go(row.getAttribute('data-page'));
    });
  });

  window.addEventListener('hashchange', route);
  route();

  document.getElementById('reportCount').textContent = Object.keys(REPORTS).length;
</script>
