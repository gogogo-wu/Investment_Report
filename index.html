<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的金融发散笔记</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #000; color: #f5f5f7;
    height: 100vh; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .layout { display: flex; height: 100vh; }

  /* ===== 左侧导航（Apple 风格：近黑面板 + 半透明高亮 + 细腻灰阶） ===== */
  .sidebar {
    width: 272px; flex-shrink: 0;
    background: #1c1c1e;
    border-right: 1px solid rgba(255,255,255,.08);
    display: flex; flex-direction: column;
  }
  .sidebar-header { padding: 24px 18px 14px; border-bottom: 1px solid rgba(255,255,255,.06); }
  .sidebar-header h1 { font-size: 15px; font-weight: 600; color: #f5f5f7; letter-spacing: .2px; }
  .sidebar-header p { font-size: 11px; color: #86868b; margin-top: 4px; letter-spacing: .2px; }
  .nav { flex: 1; overflow-y: auto; padding: 10px 10px 24px; }
  .nav::-webkit-scrollbar { width: 6px; }
  .nav::-webkit-scrollbar-thumb { background: #3a3a3c; border-radius: 3px; }
  .nav-group-title {
    font-size: 11px; font-weight: 500;
    letter-spacing: .8px; color: #98989d;
    padding: 18px 12px 8px;
  }
  .nav-item {
    display: block; width: 100%; text-align: left;
    background: none; border: none; cursor: pointer;
    padding: 8px 12px; border-radius: 8px;
    color: #e5e5ea; font-size: 13px; line-height: 1.5;
    font-family: inherit;
    transition: background .18s ease, color .18s ease;
  }
  .nav-item:hover { background: rgba(255,255,255,.06); color: #f5f5f7; }
  .nav-item.active { background: rgba(255,255,255,.12); color: #ffffff; }
  .nav-item .t { display: block; font-weight: 500; }
  .nav-item .d { display: block; font-size: 11px; color: #86868b; margin-top: 3px; line-height: 1.45; }
  .nav-item.active .d { color: #a1a1a6; }
  .sidebar-footer {
    padding: 14px 18px; border-top: 1px solid rgba(255,255,255,.06);
    font-size: 11px; color: #86868b; line-height: 1.7;
  }

  /* ===== 右侧内容区 ===== */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  /* ---- 首页：文档目录 ---- */
  .home {
    flex: 1; overflow-y: auto; padding: 56px 32px 64px;
    display: flex; justify-content: center;
  }
  .home-inner { max-width: 860px; width: 100%; }
  .home h2 { font-size: 26px; font-weight: 600; color: #f5f5f7; letter-spacing: .3px; }
  .home-sub { font-size: 14px; color: #a1a1a6; margin-top: 10px; line-height: 1.7; }
  .stats { display: flex; gap: 12px; margin: 36px 0 8px; }
  .stat {
    flex: 1; background: #1d1d1f; border-radius: 12px; padding: 16px 18px;
  }
  .stat-num { font-size: 24px; font-weight: 600; color: #2997ff; font-variant-numeric: tabular-nums; }
  .stat-label { font-size: 12px; color: #98989d; margin-top: 4px; }

  .toc { margin-top: 28px; }
  .toc-group { margin-bottom: 30px; }
  .toc-group-title {
    font-size: 15px; font-weight: 600; color: #f5f5f7;
    padding-bottom: 12px; margin-bottom: 6px;
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .toc-row {
    display: grid; grid-template-columns: 52px 190px 1fr 28px;
    align-items: center; gap: 8px;
    width: 100%; text-align: left;
    background: none; border: none; cursor: pointer;
    padding: 12px 10px; border-radius: 10px;
    color: inherit; font-family: inherit;
    transition: background .18s ease;
  }
  .toc-row:hover { background: rgba(255,255,255,.05); }
  .toc-no { font-size: 12px; color: #2997ff; font-weight: 500; font-variant-numeric: tabular-nums; }
  .toc-title { font-size: 14px; font-weight: 500; color: #e5e5ea; }
  .toc-desc { font-size: 12px; color: #86868b; line-height: 1.5; }
  .toc-arrow { font-size: 14px; color: #48484a; text-align: right; transition: color .18s ease, transform .18s ease; }
  .toc-row:hover .toc-arrow { color: #2997ff; transform: translateX(3px); }

  .home-foot {
    margin-top: 44px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.08);
    font-size: 11px; color: #86868b; line-height: 1.8;
  }

  #frame { flex: 1; width: 100%; border: none; background: #000; display: none; }
</style>
</head>

          <div class="toc-group">

            <button class="toc-row" data-page="page2">
              <span class="toc-no">P02</span>
              <span class="toc-title">Intel $200亿增发案例分析</span>

<script>
  var REPORTS = {
    page1: { file: '美日汇率干预与全球金融传导学习笔记.html', title: '美日汇率干预与全球金融传导' },
    page2: { file: 'Intel增发案例分析.html',               title: 'Intel $200亿增发案例分析' },
    page3: { file: 'AI硬件长期建仓策略.html',              title: 'AI硬件长期建仓策略' },
    page4: { file: 'AI产业链深度研究讲义.html',            title: 'AI产业链深度研究讲义' },
    page5: { file: 'ASIC四标的深度建仓分析.html',          title: 'ASIC四标的深度建仓分析' },
    page6: { file: 'AI资本结构风险与泡沫类比分析.html',    title: 'AI资本结构风险与泡沫类比分析' }
  };

  var frame = document.getElementById('frame');
  var home = document.getElementById('home');
  var items = Array.prototype.slice.call(document.querySelectorAll('.nav-item'));
  var tocRows = Array.prototype.slice.call(document.querySelectorAll('.toc-row'));

  function showHome() {
    home.style.display = 'flex';
    frame.style.display = 'none';
    items.forEach(function (it) { it.classList.remove('active'); });
    document.title = '我的金融发散笔记';
  }

  function openPage(page) {
    var r = REPORTS[page];
    if (!r) return;
    home.style.display = 'none';
    frame.style.display = 'block';
    frame.src = r.file;
    items.forEach(function (it) {
      it.classList.toggle('active', it.getAttribute('data-page') === page);
    });
    document.title = r.title + ' · 我的金融发散笔记';
  }

  function route() {
    var h = (location.hash || '').replace('#', '');
    if (h === '' || h === 'home' || !REPORTS[h]) { showHome(); return; }
    openPage(h);
    var target = document.querySelector('[data-page="' + h + '"]');
    if (target && target.scrollIntoView) target.scrollIntoView({ block: 'nearest' });
  }

  function go(page) {
    if (location.hash === '#' + page) { route(); } else { location.hash = page; }
  }

  items.forEach(function (item) {
    item.addEventListener('click', function () {
      var page = item.getAttribute('data-page');
      if (page) go(page);
    });
  });

  tocRows.forEach(function (row) {
    row.addEventListener('click', function () {
      go(row.getAttribute('data-page'));
    });
  });

  window.addEventListener('hashchange', route);
  route();

  document.getElementById('reportCount').textContent = Object.keys(REPORTS).length;
</script>
</body>
</html>
