    page14: { file: 'AI割裂与第二所有者.html',                  title: 'AI割裂与第二所有者' },
    page15: { file: '电力与物理AI.html',                        title: '电力与物理AI' },
    page16: { file: 'AI挤占与防守反击.html',                    title: 'AI挤占与防守反击' },
    page17: { file: 'AI周期见顶与行业命运.html',                title: 'AI周期见顶与行业命运' },
    page18: { file: '错杀与历史底部收租.html',                  title: '非AI错杀与历史底部收租' },

    page20: { file: '英伟达财报裂口与周期延长.html',            title: '英伟达财报裂口与周期延长' },
    page21: { file: '自由电子激光与Terafab技术期权.html',      title: '自由电子激光与Terafab技术期权' },

  var frame = document.getElementById('frame');
  var home = document.getElementById('home');
  var items = Array.prototype.slice.call(document.querySelectorAll('.nav-item'));
  var tocRows = Array.prototype.slice.call(document.querySelectorAll('.toc-row'));
  /* 关键：layout/navBtn 必须在 route() 首次调用前赋值，
     否则 showHome() -> closeSidebar() 会因 layout 未定义抛错，
     导致后面所有按钮事件绑定中断（手机端按钮全部失效的根因） */
  var navBtn = document.getElementById('navBtn');
  var layout = document.querySelector('.layout');
  var mask = document.getElementById('mask');

  function setNavBtnHome() {
    navBtn.classList.remove('back-btn');
    navBtn.innerHTML = '&#9776;';
    navBtn.setAttribute('aria-label', '打开菜单');
  }
  function setNavBtnBack() {
    navBtn.classList.add('back-btn');
    navBtn.innerHTML = '<span class="arrow">&lsaquo;</span> 首页';
    navBtn.setAttribute('aria-label', '返回首页');
  }

  function showHome() {
    document.body.classList.remove('in-report');
    home.style.display = 'flex';
    frame.style.display = 'none';
    items.forEach(function (it) {
      it.classList.toggle('active', it.getAttribute('data-page') === 'home');
    });
    document.title = '我的金融发散笔记';
    setNavBtnHome();
    closeSidebar();
  }

  function openPage(page) {
    var r = REPORTS[page];
    if (!r) return;
    document.body.classList.add('in-report');
    home.style.display = 'none';
    frame.style.display = 'block';
    if (frame.getAttribute('src') !== r.file) frame.src = r.file;
    items.forEach(function (it) {
      it.classList.toggle('active', it.getAttribute('data-page') === page);
    });
    document.title = r.title + ' · 我的金融发散笔记';
    setNavBtnBack();
    closeSidebar();
  }

  function route() {
    var h = (location.hash || '').replace('#', '');
    if (h === '' || h === 'home' || !REPORTS[h]) { showHome(); return; }
    openPage(h);
    var target = document.querySelector('[data-page="' + h + '"]');
    if (target && target.scrollIntoView) target.scrollIntoView({ block: 'nearest' });
  }

  function go(page) {
    if (page !== 'home' && !REPORTS[page]) page = 'home';
    /* 直接同步渲染，不依赖 hashchange 事件（部分手机浏览器中不可靠） */
    if (page === 'home') { showHome(); } else { openPage(page); }
    if (location.hash !== '#' + page) {
      try { location.hash = page; } catch (e) {}
    }
  }

  items.forEach(function (item) {
    item.addEventListener('click', function () {
      var page = item.getAttribute('data-page');
      if (page) go(page);
    });
  });

  tocRows.forEach(function (row) {
    row.addEventListener('click', function () {
      go(row.getAttribute('data-page'));
    });
  });

  window.addEventListener('hashchange', route);
  route();

  document.getElementById('reportCount').textContent = Object.keys(REPORTS).length;

  /* ===== 移动端：单一按钮（首页=打开菜单 / 报告页=返回首页） ===== */
  function closeSidebar() {
    if (layout) layout.classList.remove('sidebar-open');
  }

  function onNavBtn(e) {
    if (e && e.preventDefault) e.preventDefault();
    if (document.body.classList.contains('in-report')) {
      closeSidebar();
      go('home');
      window.scrollTo(0, 0);
    } else {
      layout.classList.toggle('sidebar-open');
    }
  }
  window.onNavBtn = onNavBtn;
  mask.addEventListener('click', closeSidebar);
</script>
