  .sidebar-header { padding: 24px 18px 14px; border-bottom: 1px solid rgba(255,255,255,.06); }
  .sidebar-header h1 {
    font-size: 15px; font-weight: 600; letter-spacing: .2px;

  .nav-group-title {
    font-size: 11px; font-weight: 500;

    position: relative;

    background: none; border: none; cursor: pointer;
    padding: 8px 12px; border-radius: 8px;
    color: #e5e5ea; font-size: 13px; line-height: 1.5;
    font-family: inherit;
    transition: background .18s ease, color .18s ease;
  }
  .nav-item:hover { background: rgba(255,255,255,.06); color: #f5f5f7; }
  .nav-item.active { background: rgba(255,255,255,.12); color: #ffffff; }
  .nav-item.active::before {
    content: ''; position: absolute; left: 0; top: 50%;
    transform: translateY(-50%);
    width: 3px; height: 16px; border-radius: 2px;
    background: linear-gradient(180deg, #2997ff, #818cf8);
  }
  .nav-item .t { display: block; font-weight: 500; }
  .nav-item .d { display: block; font-size: 11px; color: #86868b; margin-top: 3px; line-height: 1.45; }

  .sidebar-footer {

  .toc-row {
    display: grid; grid-template-columns: 52px 190px 1fr 28px;
    align-items: center; gap: 8px;
    width: 100%; text-align: left;
    background: none; border: none; cursor: pointer;

  .toc-row:hover .toc-arrow { color: #2997ff; transform: translateX(3px); }

  .home-foot {
    margin-top: 44px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.08);
    font-size: 11px; color: #86868b; line-height: 1.8;

  .menu-btn {
    position: fixed; top: 12px; left: 12px; z-index: 70;
    width: 42px; height: 42px; border-radius: 12px;
    background: rgba(28,28,30,.92); border: 1px solid rgba(255,255,255,.12);
    color: #f5f5f7; font-size: 17px; cursor: pointer;
    display: none; align-items: center; justify-content: center;

    font-family: inherit; line-height: 1;
  }
  .menu-btn.back-btn {

    font-size: 14px; font-weight: 500;
  }
  .menu-btn .arrow { font-size: 18px; line-height: 1; }
  .mask {

    background: rgba(0,0,0,.55); opacity: 0; pointer-events: none;
    transition: opacity .25s ease;
  }

  @media (max-width: 768px) {
    .menu-btn { display: flex; }
    .sidebar {

  function showHome() {
    document.body.classList.remove('in-report');
    home.style.display = 'flex';
    frame.style.display = 'none';
    items.forEach(function (it) {
      it.classList.toggle('active', it.getAttribute('data-page') === 'home');
    });
    document.title = '我的金融发散笔记';
    setNavBtnHome();
    closeSidebar();
  }

  function openPage(page) {
    var r = REPORTS[page];
    if (!r) return;
    document.body.classList.add('in-report');
    home.style.display = 'none';
    frame.style.display = 'block';
    if (frame.getAttribute('src') !== r.file) frame.src = r.file;
    items.forEach(function (it) {
      it.classList.toggle('active', it.getAttribute('data-page') === page);
    });
    document.title = r.title + ' · 我的金融发散笔记';
    setNavBtnBack();
    closeSidebar();
  }

  function route() {
    var h = (location.hash || '').replace('#', '');
    if (h === '' || h === 'home' || !REPORTS[h]) { showHome(); return; }
    openPage(h);
    var target = document.querySelector('[data-page="' + h + '"]');
    if (target && target.scrollIntoView) target.scrollIntoView({ block: 'nearest' });
  }

  function go(page) {
    if (page !== 'home' && !REPORTS[page]) page = 'home';
    /* 直接同步渲染，不依赖 hashchange 事件（部分手机浏览器中不可靠） */
    if (page === 'home') { showHome(); } else { openPage(page); }
    if (location.hash !== '#' + page) {
      try { location.hash = page; } catch (e) {}
    }
  }

  items.forEach(function (item) {
    item.addEventListener('click', function () {
      var page = item.getAttribute('data-page');
      if (page) go(page);
    });
  });

  tocRows.forEach(function (row) {
    row.addEventListener('click', function () {
      go(row.getAttribute('data-page'));
    });
  });

  window.addEventListener('hashchange', route);
  route();

  document.getElementById('reportCount').textContent = Object.keys(REPORTS).length;

  /* ===== 移动端：单一按钮（首页=打开菜单 / 报告页=返回首页） ===== */
  function closeSidebar() {
    if (layout) layout.classList.remove('sidebar-open');
  }

  function onNavBtn(e) {
    if (e && e.preventDefault) e.preventDefault();
    if (document.body.classList.contains('in-report')) {
      closeSidebar();
      go('home');
      window.scrollTo(0, 0);
    } else {
      layout.classList.toggle('sidebar-open');
    }
  }
  window.onNavBtn = onNavBtn;
  mask.addEventListener('click', closeSidebar);
</script>
</body>
</html>
