      file: '2026/09/诺基亚的存活之道巨头转型市占率地图筹码换手与价格阶梯.html', title: '诺基亚的存活之道：巨头转型、市占率地图、筹码换手与价格阶梯',
      ym: '2026-09', grp: 'ai', no: 'P37',
      d: '三大战场市占率地图 · CMD 2028 考卷 · 客户四分法与营收三切法 · Q2 两本账 · ROIC 不及格审计 · 13F 筹码换手 · 建仓阶梯 · 灵魂第二十二条',
      desc: 'RAN 第三 20% 慢市场 vs 光传输第三 9.4% 快市场 · 英伟达 $6.01 产业资本锚与循环关系审计 · AI 占 9% 却贡献 60% 增长 · 报告口径亏损与 FCF -7.3 亿的两本账 · ROIC 4-6% 低于 WACC · 动量盘被套 20% 的筹码换手 · Z1 8.5-9.5 / Z2 7-8 / Z3 5.9-6.5 / 证伪 5.90'
    },
    page38: {
      file: '2026/09/及格但不引爆ORCL财报复盘验证型组合与叙事型排班表.html', title: '及格但不引爆：ORCL 判分卡自审、验证型组合与叙事型排班表',
      ym: '2026-09', grp: 'ai', no: 'P38',
      d: 'ORCL FY27Q1 财报前后两日还原 · 判分卡自审两好一中性 · 收铲人得钱借钱人挨打 · 三个锚位与决策树 · 全组合验证型审计 · 全库分类与叙事型排班表 · 灵魂第二十三条',
      desc: '财报及格但不引爆：RPO 环比 +260 亿中性档（增量 prepay/BYO-GPU 为主、50% 36 个月转收入）· ATM 200 亿执行完毕与 FCF 连续 6 季为负 · 9/11 冲高 8.5% 回落收 150.28 而 Dell +12%/HPE +12% = 市场付钱给收铲人不给借钱人 · 核心 CPI 超预期推 FOMC 概率至 86.5%、10Y 4.98% · 三个锚位 345.72/114.50/150.28 与 137 线决策树 · 组合三只持仓全为验证型与骗子识别线三条 · 验证型 vs 叙事型 vs 中间态全库分类 · 叙事型排班表 LINK/INTC/Anthropic 解禁 · 错杀金矿篮优先'
    }
  };

  /* ============ 分组定义 ============ */
  var GROUPS = [
    { key: 'monthly', title: '月度总览' },
    { key: 'base',    title: '基础学习' },
    { key: 'fx',      title: '一、国际金融分析' },
    { key: 'corp',    title: '二、企业金融案例分析' },
    { key: 'ai',      title: '三、AI / 硬件投资研究' }
  ];
  function repList(grp) {
    return Object.keys(REPORTS).filter(function (k) { return REPORTS[k].grp === grp; });
  }

  /* 年月收纳状态：{ '2026-07': true/false } */
  function readYmState() {
    try { return JSON.parse(localStorage.getItem('navYmOpen') || '{}') || {}; } catch (e) { return {}; }
  }
  function toggleYm(ymKey) {
    var map = readYmState();
    map[ymKey] = !map[ymKey];
    try { localStorage.setItem('navYmOpen', JSON.stringify(map)); } catch (e) {}
    renderNav();
  }

  /* ============ DOM ============ */
  var frame = document.getElementById('frame');
  var home = document.getElementById('home');
  var navEl = document.getElementById('nav');
  var tocEl = document.getElementById('toc');
  var yearSel = document.getElementById('yearSel');
  var monthSel = document.getElementById('monthSel');
  var filterClear = document.getElementById('filterClear');
  var filterCount = document.getElementById('filterCount');
  var layout = document.querySelector('.layout');
  var navBtn = document.getElementById('navBtn');
  var mask = document.getElementById('mask');

  /* ============ 年月选项 ============ */
  var YMS = [];
  Object.keys(REPORTS).forEach(function (k) {
    var ym = REPORTS[k].ym;
    if (ym && YMS.indexOf(ym) < 0) YMS.push(ym);
  });
  YMS.sort();

  function buildYearOptions() {
    var years = [];
    YMS.forEach(function (ym) {
      var y = ym.slice(0, 4);
      if (years.indexOf(y) < 0) years.push(y);
    });
    years.sort();
    yearSel.innerHTML = '<option value="">全部年份</option>' + years.map(function (y) {
      return '<option value="' + y + '">' + y + ' 年</option>';
    }).join('');
  }

  function buildMonthOptions() {
    var y = yearSel.value;
    var months = [];
    YMS.forEach(function (ym) {
      if (!y || ym.slice(0, 4) === y) {
        var m = ym.slice(5);
        if (months.indexOf(m) < 0) months.push(m);
      }
    });
    months.sort();
    var cur = monthSel.value;
    monthSel.innerHTML = '<option value="">全部月份</option>' + months.map(function (m) {
      return '<option value="' + m + '">' + parseInt(m, 10) + ' 月</option>';
    }).join('');
    if (cur && months.indexOf(cur) < 0) monthSel.value = '';
  }

  function matchesFilter(r) {
    if (!r.ym) return true;
    var y = r.ym.slice(0, 4), m = r.ym.slice(5);
    if (yearSel.value && yearSel.value !== y) return false;
    if (monthSel.value && monthSel.value !== m) return false;
    return true;
  }

  /* ============ 渲染：侧栏导航（按年月收纳分组） ============ */
  function renderNav() {
    var html = '';
    html += '<button class="nav-item" data-page="home"><span class="t">首页</span><span class="d">知识库目录</span></button>';

    /* 按 y -> m -> [keys] 归组 */
    var years = {};
    Object.keys(REPORTS).forEach(function (k) {
      var r = REPORTS[k];
      if (!r.ym) return;
      var y = r.ym.slice(0, 4), m = r.ym.slice(5);
      if (!years[y]) years[y] = {};
      if (!years[y][m]) years[y][m] = [];
      years[y][m].push(k);
    });
    var openMap = readYmState();
    var latestYm = YMS.length ? YMS[YMS.length - 1] : '';

    Object.keys(years).sort().forEach(function (y) {
      Object.keys(years[y]).sort().forEach(function (m) {
        var ymKey = y + '-' + m;
        var keys = years[y][m].slice();
        /* 组内排序：月度总结置顶，其余按编号（B01/P01/P10… 自然序） */
        keys.sort(function (a, b) {
          var ra = REPORTS[a], rb = REPORTS[b];
          if (ra.grp === 'monthly' && rb.grp !== 'monthly') return -1;
          if (rb.grp === 'monthly' && ra.grp !== 'monthly') return 1;
          return String(ra.no).localeCompare(String(rb.no), 'zh', { numeric: true });
        });
        /* 默认：最近月份展开、历史月份收纳（localStorage 可覆盖） */
        var open = openMap[ymKey] !== undefined ? openMap[ymKey] : (ymKey === latestYm);
        html += '<div class="nav-group-title nav-ym' + (open ? ' open' : '') + '" data-ym="' + ymKey + '" title="点击展开 / 收起">' +
          '<span class="ym-arrow">' + (open ? '&#9662;' : '&#9656;') + '</span>' +
          '<span>' + y + ' 年 ' + parseInt(m, 10) + ' 月</span>' +
          '<span class="ym-count">' + keys.length + ' 份</span></div>';
        if (open) {
          keys.forEach(function (k) {
            var r = REPORTS[k];
            html += '<button class="nav-item" data-page="' + k + '"><span class="t">' + r.no + ' · ' + r.title + '</span><span class="d">' + r.d + '</span></button>';
          });
        }
      });
    });
    navEl.innerHTML = html;
    /* 重渲染后恢复当前页高亮 */
    var cur = (location.hash || '').replace('#', '');
    setActive(cur && REPORTS[cur] ? cur : 'home');
  }

  /* ============ 渲染：首页目录 ============ */
  function renderToc() {
    var html = '';
    var total = 0;
    var sy = yearSel.value, sm = monthSel.value;
    var suffix = '';
    if (sy || sm) {
      var sp = [];
      if (sy) sp.push(sy + ' 年');
      if (sm) sp.push(parseInt(sm, 10) + ' 月');
      suffix = ' · ' + sp.join(' ');
    }
    GROUPS.forEach(function (g) {
      var list = repList(g.key).filter(function (k) { return matchesFilter(REPORTS[k]); });
      if (!list.length) return;
      total += list.length;
      html += '<div class="toc-group"><div class="toc-group-title">' + g.title + suffix + '</div>';
      list.forEach(function (k) {
        var r = REPORTS[k];
        html += '<button class="toc-row" data-page="' + k + '">' +
          '<span class="toc-no">' + r.no + '</span>' +
          '<span class="toc-title">' + r.title + '</span>' +
          '<span class="toc-desc">' + r.desc + '</span>' +
          '<span class="toc-arrow">&rarr;</span></button>';
      });
      html += '</div>';
    });
    tocEl.innerHTML = html || '<div class="toc-empty">该月份暂无笔记，换个年月试试</div>';
    filterCount.textContent = total ? '当前显示 ' + total + ' 份' : '';
  }

  /* ============ 筛选器事件 ============ */
  yearSel.addEventListener('change', function () {
    buildMonthOptions();
    renderToc();
  });
  monthSel.addEventListener('change', renderToc);
  filterClear.addEventListener('click', function () {
    yearSel.value = '';
    buildMonthOptions();
    monthSel.value = '';
    renderToc();
  });

  /* ============ 路由与状态 ============ */
  function setActive(page) {
    var list = navEl.querySelectorAll('.nav-item');
    for (var i = 0; i < list.length; i++) {
      list[i].classList.toggle('active', list[i].getAttribute('data-page') === page);
    }
  }

  function setNavBtnHome() {
    navBtn.classList.remove('back-btn');
    navBtn.innerHTML = '&#9776;';
    navBtn.setAttribute('aria-label', '打开菜单');
  }
  function setNavBtnBack() {
    navBtn.classList.add('back-btn');
    navBtn.innerHTML = '<span class="arrow">&lsaquo;</span> 首页';
    navBtn.setAttribute('aria-label', '返回首页');
  }

  function showHome() {
    document.body.classList.remove('in-report');
    home.style.display = 'flex';
    frame.style.display = 'none';
    setActive('home');
    document.title = '我的金融发散笔记';
    setNavBtnHome();
    closeSidebar();
  }

  function openPage(page) {
    var r = REPORTS[page];
    if (!r) return;
    document.body.classList.add('in-report');
    home.style.display = 'none';
    frame.style.display = 'block';
    if (frame.getAttribute('src') !== r.file) frame.src = r.file;
    setActive(page);
    document.title = r.title + ' · 我的金融发散笔记';
    setNavBtnBack();
    closeSidebar();
  }

  function route() {
    var h = (location.hash || '').replace('#', '');
    if (h === '' || h === 'home' || !REPORTS[h]) { showHome(); return; }
    openPage(h);
    var target = navEl.querySelector('[data-page="' + h + '"]');
    if (target && target.scrollIntoView) target.scrollIntoView({ block: 'nearest' });
  }

  function go(page) {
    if (page !== 'home' && !REPORTS[page]) page = 'home';
    if (page === 'home') { showHome(); } else { openPage(page); }
    if (location.hash !== '#' + page) {
      try { location.hash = page; } catch (e) {}
    }
  }

  /* 事件委托：动态渲染的 nav-ym（年月折叠）/ nav-item / toc-row */
  document.addEventListener('click', function (e) {
    var t = e.target;
    /* 年月组标题：展开 / 收起 */
    var g = t;
    while (g && g !== document && !(g.classList && g.classList.contains('nav-ym'))) g = g.parentNode;
    if (g && g !== document) {
      toggleYm(g.getAttribute('data-ym'));
      return;
    }
    /* 报告条目 */
    while (t && t !== document && !(t.classList && (t.classList.contains('nav-item') || t.classList.contains('toc-row')))) {
      t = t.parentNode;
    }
    if (!t || t === document) return;
    var page = t.getAttribute('data-page');
    if (page) go(page);
  });

  window.addEventListener('hashchange', route);

  /* ============ 侧栏折叠（桌面端） ============ */
  function setCollapsed(c) {
    layout.classList.toggle('sidebar-collapsed', c);
    try { localStorage.setItem('sbCollapsed', c ? '1' : '0'); } catch (e) {}
  }
  window.setCollapsed = setCollapsed;

  function closeSidebar() {
    if (layout) layout.classList.remove('sidebar-open');
  }

  function onNavBtn(e) {
    if (e && e.preventDefault) e.preventDefault();
    if (document.body.classList.contains('in-report')) {
      closeSidebar();
      go('home');
      window.scrollTo(0, 0);
    } else {
      layout.classList.toggle('sidebar-open');
    }
  }
  window.onNavBtn = onNavBtn;
  mask.addEventListener('click', closeSidebar);

  /* ============ 初始化 ============ */
  buildYearOptions();
  buildMonthOptions();
  renderNav();
  renderToc();
  route();

  var total = Object.keys(REPORTS).length;
  var areas = GROUPS.filter(function (g) {
    return g.key !== 'monthly' && g.key !== 'base' && repList(g.key).length > 0;
  }).length;
  document.getElementById('reportCount').textContent = total;
  document.getElementById('areaCount').textContent = areas;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statArea').textContent = areas;
  document.getElementById('statLatest').textContent = YMS.length ? YMS[YMS.length - 1] : '—';
  document.getElementById('latestYm').textContent = YMS.length ? YMS[YMS.length - 1] : '—';

  try { if (localStorage.getItem('sbCollapsed') === '1') setCollapsed(true); } catch (e) {}
</script>
</body>
</html>
