<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金融学习 · 知识库</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0f172a; color: #e2e8f0;
    height: 100vh; overflow: hidden;
  }
  .layout { display: flex; height: 100vh; }

  /* ===== 左侧导航 ===== */
  .sidebar {
    width: 272px; flex-shrink: 0;
    background: #0b1220;
    border-right: 1px solid #1e293b;
    display: flex; flex-direction: column;
  }
  .sidebar-header { padding: 20px 18px 12px; border-bottom: 1px solid #1e293b; }
  .sidebar-header h1 { font-size: 16px; font-weight: 700; color: #f1f5f9; }
  .sidebar-header p { font-size: 11px; color: #8b93a7; margin-top: 3px; }
  .nav { flex: 1; overflow-y: auto; padding: 8px 10px 24px; }
  .nav::-webkit-scrollbar { width: 6px; }
  .nav::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  .nav-group-title {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1.2px; color: #8b93a7;
    padding: 16px 10px 6px;
  }
  .nav-item {
    display: block; width: 100%; text-align: left;
    background: none; border: none; cursor: pointer;
    padding: 9px 12px; border-radius: 8px;
    color: #cbd5e1; font-size: 13px; line-height: 1.45;
    font-family: inherit;
    transition: background .15s, color .15s;
  }
  .nav-item:hover { background: #243049; color: #f1f5f9; }
  .nav-item.active { background: rgba(99,102,241,.18); color: #c7d2fe; }
  .nav-item .t { display: block; font-weight: 500; }
  .nav-item .d { display: block; font-size: 11px; color: #94a3b8; margin-top: 2px; }
  .nav-item.active .d { color: #a5b4fc; }
  .nav-item .badge {
    display: inline-block; font-size: 10px; font-weight: 500;
    padding: 1px 5px; border-radius: 3px; margin-left: 5px;
    background: rgba(245,158,11,.18); color: #fbbf24; vertical-align: middle;
  }
  .submenu {
    padding: 0 10px 8px 10px;
    display: none;
  }
  .submenu.open { display: block; }
  .submenu .sub-item {
    display: block; width: 100%; text-align: left;
    background: none; border: none; cursor: pointer;
    padding: 7px 12px 7px 28px; border-radius: 6px;
    color: #a8b3c8; font-size: 12px; line-height: 1.4;
    font-family: inherit;
    transition: background .15s, color .15s;
  }
  .submenu .sub-item:hover { background: #243049; color: #f1f5f9; }
  .submenu .sub-item.active { color: #c7d2fe; background: rgba(99,102,241,.12); }
  .sidebar-footer {
    padding: 12px 18px; border-top: 1px solid #1e293b;
    font-size: 11px; color: #7c86a0; line-height: 1.6;
  }

  /* ===== 右侧内容 ===== */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .welcome {
    flex: 1; display: flex; align-items: center; justify-content: center;
    overflow-y: auto; padding: 40px 24px;
  }
  .welcome-inner { max-width: 760px; width: 100%; }
  .welcome h2 { font-size: 30px; font-weight: 700; color: #f1f5f9; letter-spacing: .5px; }
  .welcome-sub { font-size: 14px; color: #64748b; margin-top: 8px; }
  .stats { display: flex; gap: 12px; margin: 32px 0; }
  .stat {
    flex: 1; background: #1e293b; border: 1px solid #334155;
    border-radius: 12px; padding: 18px 16px;
  }
  .stat-num { font-size: 24px; font-weight: 700; color: #a5b4fc; }
  .stat-label { font-size: 12px; color: #64748b; margin-top: 4px; }
  .welcome-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; margin-top: 8px; }
  .welcome-card {
    display: block; width: 100%; text-align: left;
    background: #1e293b; border: 1px solid #334155;
    border-radius: 12px; padding: 16px 18px; cursor: pointer;
    font-family: inherit; color: inherit;
    transition: border-color .15s, transform .15s;
  }
  .welcome-card:hover { border-color: #6366f1; transform: translateY(-1px); }
  .welcome-card .ct { font-size: 14px; font-weight: 600; color: #f1f5f9; }
  .welcome-card .cd { font-size: 12px; color: #94a3b8; margin-top: 4px; line-height: 1.5; }
  .welcome-card .cn { font-size: 11px; color: #6366f1; margin-top: 8px; display: block; }
  #frame { flex: 1; width: 100%; border: none; background: #fff; display: none; }
</style>
</head>
<body>
<div class="layout">

  <!-- ==================== 左侧导航 ==================== -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>金融学习 · 知识库</h1>
      <p>报告 · 笔记 · 策略分析</p>
    </div>

    <nav class="nav">
      <div class="nav-group-title">金融通识与体系</div>
      <button class="nav-item" data-toggle="submenu-foundation">
        <span class="t">金融通识与体系 <span class="badge">未完成</span></span>
        <span class="d">体系蓝图、学习路线、讲义与视频课程</span>
      </button>
      <div class="submenu" id="submenu-foundation">
        <button class="sub-item" data-file="金融体系蓝图.html">
          个人金融体系蓝图
        </button>
        <button class="sub-item" data-file="学习路线.html">
          完整学习路线
        </button>
        <button class="sub-item" data-file="核心学习讲义.html">
          核心学习讲义
        </button>
        <button class="sub-item" data-file="金融视频课程-连贯版.html">
          从小白到能自己管钱
        </button>
      </div>

      <div class="nav-group-title">国际金融分析</div>
      <button class="nav-item" data-file="美日汇率干预与全球金融传导学习笔记.html">
        <span class="t">美日汇率干预与全球金融传导</span>
        <span class="d">BOJ政策、套息交易、全球资产联动深度笔记</span>
      </button>

      <div class="nav-group-title">企业金融案例分析</div>
      <button class="nav-item" data-file="Intel增发案例分析.html">
        <span class="t">Intel $200亿增发案例分析</span>
        <span class="d">融资决策框架 · 5倍超额认购 · ASIC产业链联动 · 投资观察</span>
      </button>

      <div class="nav-group-title">AI / 硬件投资研究</div>
      <button class="nav-item" data-file="AI硬件长期建仓策略.html">
        <span class="t">AI硬件长期建仓策略</span>
        <span class="d">卖铲人家族全景 + 八大标的双情景建仓区间</span>
      </button>
      <button class="nav-item" data-file="AI产业链深度研究讲义.html">
        <span class="t">AI产业链深度研究讲义</span>
        <span class="d">产业链七层拆解、HBM/CoWoS/光模块/液冷等深度分析</span>
      </button>
      <button class="nav-item" data-file="ASIC四标的深度建仓分析.html">
        <span class="t">ASIC四标的深度建仓分析</span>
        <span class="d">AVGO/SNPS/MRVL/Socionext · 最新财报 + 双情景建仓区间</span>
      </button>
      <button class="nav-item" data-file="AI资本结构风险与泡沫类比分析.html">
        <span class="t">AI资本结构风险与泡沫类比分析</span>
        <span class="d">$5000亿融资平台风险瀑布 · SEC豁免 · 2000+2008类比 · 四道关卡</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      共 <span id="reportCount">10</span> 份报告 · 4 大分类<br>
      最后更新 2026-08-12
    </div>
  </aside>

  <!-- ==================== 右侧内容区 ==================== -->
  <main class="main">
    <div class="welcome" id="welcome">
      <div class="welcome-inner">
        <h2>金融学习 · 知识库</h2>
        <p class="welcome-sub">系统性金融知识体系与投资研究索引 &mdash; 点击左侧导航进入对应内容</p>

        <div class="stats">
          <div class="stat">
            <div class="stat-num">10</div>
            <div class="stat-label">份研究资料</div>
          </div>
          <div class="stat">
            <div class="stat-num">4</div>
            <div class="stat-label">个知识领域</div>
          </div>
          <div class="stat">
            <div class="stat-num">2026-08</div>
            <div class="stat-label">最近更新</div>
          </div>
        </div>

        <div class="welcome-grid">
          <button class="welcome-card" data-toggle="submenu-foundation">
            <span class="ct">金融通识与体系 <span class="badge">未完成</span></span>
            <span class="cd">知识框架、学习路径与核心概念的体系化梳理</span>
            <span class="cn">4 份资料 · 点击展开 &rarr;</span>
          </button>
          <button class="welcome-card" data-file="美日汇率干预与全球金融传导学习笔记.html">
            <span class="ct">国际金融分析</span>
            <span class="cd">央行政策、汇率机制与全球资本流动研究</span>
            <span class="cn">1 份资料 · 点击进入 &rarr;</span>
          </button>
          <button class="welcome-card" data-file="Intel增发案例分析.html">
            <span class="ct">企业金融案例分析</span>
            <span class="cd">上市公司融资决策与资本运作的深度拆解</span>
            <span class="cn">1 份资料 · 点击进入 &rarr;</span>
          </button>
          <button class="welcome-card" data-file="AI硬件长期建仓策略.html">
            <span class="ct">AI / 硬件投资研究</span>
            <span class="cd">AI 基础设施产业链、标的分析与风险框架</span>
            <span class="cn">4 份资料 · 点击进入 &rarr;</span>
          </button>
        </div>
      </div>
    </div>

    <iframe id="frame" title="报告预览"></iframe>
  </main>

</div>

<script>
  var frame = document.getElementById('frame');
  var welcome = document.getElementById('welcome');
  var items = Array.prototype.slice.call(document.querySelectorAll('.nav-item'));
  var subItems = Array.prototype.slice.call(document.querySelectorAll('.sub-item'));

  function openFile(file) {
    items.forEach(function (item) { item.classList.remove('active'); });
    subItems.forEach(function (s) { s.classList.toggle('active', s.getAttribute('data-file') === file); });
    welcome.style.display = 'none';
    frame.style.display = 'block';
    frame.src = file;
  }

  items.forEach(function (item) {
    item.addEventListener('click', function () {
      var toggle = item.getAttribute('data-toggle');
      if (toggle) {
        var sub = document.getElementById(toggle);
        sub.classList.toggle('open');
      } else {
        var file = item.getAttribute('data-file');
        if (file) openFile(file);
      }
    });
  });

  subItems.forEach(function (sub) {
    sub.addEventListener('click', function () {
      openFile(sub.getAttribute('data-file'));
    });
  });

  document.querySelectorAll('.welcome-card').forEach(function (card) {
    card.addEventListener('click', function () {
      var toggle = card.getAttribute('data-toggle');
      if (toggle) {
        document.getElementById(toggle).classList.toggle('open');
      } else {
        openFile(card.getAttribute('data-file'));
      }
    });
  });

  document.getElementById('reportCount').textContent = items.length + subItems.length;
</script>
</body>
</html>
